<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Flower Garden Animation</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:#050d11;
}

.garden{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:
      radial-gradient(circle at 50% 55%,
      rgba(0,100,120,.18),
      transparent 38%),
      #030a0e;
}

/* ---------------- STARS ---------------- */

.star{
    position:absolute;
    width:3px;
    height:3px;
    border-radius:50%;
    background:#bfffff;
    box-shadow:0 0 8px #7fffff;
    animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
    from{opacity:.15;transform:scale(.5)}
    to{opacity:1;transform:scale(1.5)}
}

/* ---------------- FIREFLIES ---------------- */

.firefly{
    position:absolute;
    width:5px;
    height:5px;
    border-radius:50%;
    background:#d9ff55;
    box-shadow:0 0 14px #d9ff55;
    animation:fly 5s linear infinite;
}

@keyframes fly{
    0%{
        transform:translate(0,0);
        opacity:0;
    }
    20%{opacity:1}
    50%{
        transform:translate(30px,-40px);
    }
    80%{opacity:1}
    100%{
        transform:translate(-20px,-90px);
        opacity:0;
    }
}

/* ---------------- GRASS ---------------- */

.grass{
    position:absolute;
    bottom:0;
    width:100%;
    height:32%;
}

.blade{
    position:absolute;
    bottom:0;
    width:6px;
    border-radius:100% 0 100% 0;
    background:linear-gradient(
        to top,
        #064019,
        #28c94d
    );
    transform-origin:bottom;
    animation:sway 3s ease-in-out infinite alternate;
}

@keyframes sway{
    from{transform:rotate(-6deg)}
    to{transform:rotate(7deg)}
}

/* ---------------- PLANTS ---------------- */

.plant{
    position:absolute;
    bottom:8%;
    left:50%;
    width:500px;
    height:650px;
    transform:translateX(-50%);
}

/* Stems */

.stem{
    position:absolute;
    bottom:60px;
    width:7px;
    border-radius:10px;
    background:linear-gradient(
        to top,
        #07525b,
        #4bdbe0
    );
    transform-origin:bottom;
    animation:stemGrow 2s ease-out forwards,
              stemMove 4s ease-in-out infinite alternate;
}

.stem-blue{
    left:30%;
    height:380px;
    transform:rotate(-7deg);
}

.stem-center{
    left:50%;
    height:520px;
}

.stem-rose{
    left:70%;
    height:410px;
    transform:rotate(7deg);
}

@keyframes stemGrow{
    from{transform:scaleY(0)}
    to{transform:scaleY(1)}
}

@keyframes stemMove{
    from{margin-left:-3px}
    to{margin-left:5px}
}

/* ---------------- LEAVES ---------------- */

.leaf{
    position:absolute;
    width:75px;
    height:34px;
    background:linear-gradient(
        135deg,
        #075466,
        #22b9c7
    );
    border-radius:100% 0 100% 0;
    box-shadow:0 0 10px rgba(50,220,240,.25);
    animation:leafMove 3s ease-in-out infinite alternate;
}

@keyframes leafMove{
    from{margin-left:-3px}
    to{margin-left:5px}
}

.leaf1{
    left:22%;
    bottom:260px;
    transform:rotate(-25deg);
}

.leaf2{
    left:33%;
    bottom:350px;
    transform:rotate(25deg);
}

.leaf3{
    left:52%;
    bottom:300px;
    transform:rotate(-30deg);
}

.leaf4{
    left:62%;
    bottom:390px;
    transform:rotate(25deg);
}

.leaf5{
    left:42%;
    bottom:180px;
    transform:rotate(-20deg);
}

.leaf6{
    left:60%;
    bottom:170px;
    transform:rotate(25deg);
}

/* ================================================= */
/*                    BLUE FLOWER                    */
/* ================================================= */

.blue-flower{
    position:absolute;
    left:30%;
    top:25%;
    width:100px;
    height:100px;
    transform:translate(-50%,-50%);
    animation:blueFloat 4s ease-in-out infinite alternate;
}

@keyframes blueFloat{
    from{margin-left:-4px}
    to{margin-left:5px}
}

.blue-petal{
    position:absolute;
    left:50%;
    top:50%;
    width:43px;
    height:65px;
    border-radius:50%;
    background:linear-gradient(
        to bottom,
        #d3ffff,
        #46bcca
    );
    transform-origin:50% 100%;
    filter:drop-shadow(0 0 9px #52e4ed);
}

.bp1{transform:translate(-50%,-100%) rotate(0)}
.bp2{transform:translate(-50%,-100%) rotate(72deg)}
.bp3{transform:translate(-50%,-100%) rotate(144deg)}
.bp4{transform:translate(-50%,-100%) rotate(216deg)}
.bp5{transform:translate(-50%,-100%) rotate(288deg)}

.blue-center{
    position:absolute;
    left:50%;
    top:50%;
    width:27px;
    height:27px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:#efff75;
    box-shadow:
      0 0 8px #ffff55,
      0 0 20px #8effff;
}

/* ================================================= */
/*                     ROSE 🌹                       */
/* ================================================= */

.rose{
    position:absolute;
    left:70%;
    top:22%;
    width:130px;
    height:130px;

    transform:
      translate(-50%,-50%)
      scale(.12);

    animation:roseBloom 8s ease-in-out infinite;

    filter:
      drop-shadow(0 0 12px rgba(255,40,70,.55));
}

/* Rose petals */

.rose-petal{
    position:absolute;
    left:50%;
    top:50%;

    width:62px;
    height:80px;

    background:
      radial-gradient(
        circle at 50% 75%,
        #ff8a9b,
        #e52a50 55%,
        #87001f
      );

    border-radius:55% 55% 45% 45%;

    transform-origin:50% 90%;

    box-shadow:
      inset -5px -8px 12px rgba(80,0,20,.3);
}

/* Outer petals */

.rp1{
    transform:
      translate(-50%,-50%)
      rotate(0deg)
      translateY(-20px);
}

.rp2{
    transform:
      translate(-50%,-50%)
      rotate(45deg)
      translateY(-20px);
}

.rp3{
    transform:
      translate(-50%,-50%)
      rotate(90deg)
      translateY(-20px);
}

.rp4{
    transform:
      translate(-50%,-50%)
      rotate(135deg)
      translateY(-20px);
}

.rp5{
    transform:
      translate(-50%,-50%)
      rotate(180deg)
      translateY(-20px);
}

.rp6{
    transform:
      translate(-50%,-50%)
      rotate(225deg)
      translateY(-20px);
}

.rp7{
    transform:
      translate(-50%,-50%)
      rotate(270deg)
      translateY(-20px);
}

.rp8{
    transform:
      translate(-50%,-50%)
      rotate(315deg)
      translateY(-20px);
}

/* Rose center */

.rose-center{
    position:absolute;
    left:50%;
    top:50%;

    width:40px;
    height:50px;

    background:
      linear-gradient(
        135deg,
        #ff657b,
        #9e0028
      );

    border-radius:
      50% 50% 45% 45%;

    transform:
      translate(-50%,-50%)
      rotate(-15deg);

    box-shadow:
      inset -6px -7px 10px rgba(70,0,20,.4),
      0 0 12px rgba(255,50,80,.5);
}

/* 🌹 Bloom */

@keyframes roseBloom{

    0%{
        transform:
          translate(-50%,-50%)
          scale(.12)
          rotate(-5deg);
    }

    12%{
        transform:
          translate(-50%,-50%)
          scale(.22)
          rotate(3deg);
    }

    30%{
        transform:
          translate(-50%,-50%)
          scale(.45)
          rotate(-2deg);
    }

    50%{
        transform:
          translate(-50%,-50%)
          scale(.72)
          rotate(3deg);
    }

    68%{
        transform:
          translate(-50%,-50%)
          scale(.95)
          rotate(-2deg);
    }

    78%{
        transform:
          translate(-50%,-50%)
          scale(1.08)
          rotate(2deg);
    }

    88%{
        transform:
          translate(-50%,-50%)
          scale(1)
          rotate(-1deg);
    }

    100%{
        transform:
          translate(-50%,-50%)
          scale(.12)
          rotate(-5deg);
    }
}

/* ---------------- GRASS POSITIONS ---------------- */

.g1{left:5%;height:140px}
.g2{left:12%;height:190px;animation-delay:.5s}
.g3{left:20%;height:120px;animation-delay:1s}
.g4{left:82%;height:160px;animation-delay:.7s}
.g5{left:90%;height:120px;animation-delay:1.3s}
.g6{left:96%;height:180px;animation-delay:.2s}

/* ---------------- STARS POSITIONS ---------------- */

.s1{left:8%;top:15%}
.s2{left:18%;top:28%;animation-delay:.5s}
.s3{left:30%;top:10%;animation-delay:1s}
.s4{left:43%;top:20%;animation-delay:1.4s}
.s5{left:55%;top:8%;animation-delay:.7s}
.s6{left:67%;top:27%;animation-delay:1.8s}
.s7{left:80%;top:14%;animation-delay:.3s}
.s8{left:91%;top:31%;animation-delay:1.1s}
.s9{left:74%;top:40%;animation-delay:.8s}
.s10{left:37%;top:37%;animation-delay:1.5s}

/* ---------------- FIREFLY POSITIONS ---------------- */

.f1{left:42%;top:32%}
.f2{left:60%;top:20%;animation-delay:1s}
.f3{left:76%;top:36%;animation-delay:2s}
.f4{left:33%;top:22%;animation-delay:3s}

</style>
</head>

<body>

<div class="garden">

    <!-- Stars -->
    <span class="star s1"></span>
    <span class="star s2"></span>
    <span class="star s3"></span>
    <span class="star s4"></span>
    <span class="star s5"></span>
    <span class="star s6"></span>
    <span class="star s7"></span>
    <span class="star s8"></span>
    <span class="star s9"></span>
    <span class="star s10"></span>

    <!-- Fireflies -->
    <span class="firefly f1"></span>
    <span class="firefly f2"></span>
    <span class="firefly f3"></span>
    <span class="firefly f4"></span>

    <!-- Grass -->
    <div class="grass">
        <span class="blade g1"></span>
        <span class="blade g2"></span>
        <span class="blade g3"></span>
        <span class="blade g4"></span>
        <span class="blade g5"></span>
        <span class="blade g6"></span>
    </div>

    <!-- Plants -->
    <div class="plant">

        <div class="stem stem-blue"></div>
        <div class="stem stem-center"></div>
        <div class="stem stem-rose"></div>

        <!-- Leaves -->
        <span class="leaf leaf1"></span>
        <span class="leaf leaf2"></span>
        <span class="leaf leaf3"></span>
        <span class="leaf leaf4"></span>
        <span class="leaf leaf5"></span>
        <span class="leaf leaf6"></span>

        <!-- 🌸 Blue Flower -->
        <div class="blue-flower">

            <span class="blue-petal bp1"></span>
            <span class="blue-petal bp2"></span>
            <span class="blue-petal bp3"></span>
            <span class="blue-petal bp4"></span>
            <span class="blue-petal bp5"></span>

            <span class="blue-center"></span>

        </div>

        <!-- 🌹 Slowly Blooming Rose -->
        <div class="rose">

            <span class="rose-petal rp1"></span>
            <span class="rose-petal rp2"></span>
            <span class="rose-petal rp3"></span>
            <span class="rose-petal rp4"></span>
            <span class="rose-petal rp5"></span>
            <span class="rose-petal rp6"></span>
            <span class="rose-petal rp7"></span>
            <span class="rose-petal rp8"></span>

            <span class="rose-center"></span>

        </div>

    </div>

</div>

</body>
</html>
