<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>आपके लिए कुछ खास ✨</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    overflow:hidden;
    font-family:Arial, sans-serif;
    color:#fff;
    background:
        radial-gradient(circle at 20% 20%,#7c3aed55,transparent 35%),
        radial-gradient(circle at 80% 80%,#ec489955,transparent 35%),
        linear-gradient(135deg,#080014,#18002f,#05000d);

    display:flex;
    align-items:center;
    justify-content:center;
    perspective:1200px;
}

/* Moving background */
body::before,
body::after{
    content:"";
    position:fixed;
    width:300px;
    height:300px;
    border-radius:50%;
    filter:blur(80px);
    opacity:.35;
    animation:move 8s infinite alternate ease-in-out;
}

body::before{
    background:#9333ea;
    top:-100px;
    left:-100px;
}

body::after{
    background:#ec4899;
    bottom:-120px;
    right:-100px;
    animation-delay:2s;
}

@keyframes move{
    from{transform:translate(0,0);}
    to{transform:translate(100px,70px);}
}

/* 3D Card */
.card{
    width:min(92%,450px);
    padding:34px 25px;
    text-align:center;

    background:rgba(255,255,255,.09);
    border:1px solid rgba(255,255,255,.2);
    border-radius:30px;

    backdrop-filter:blur(18px);

    box-shadow:
        0 30px 70px #0008,
        inset 0 1px 1px #fff3;

    transform-style:preserve-3d;

    transition:transform .2s ease;

    position:relative;
    z-index:5;
}

/* Shine */
.card::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:30px;
    background:
        linear-gradient(
            120deg,
            transparent 20%,
            #ffffff18 45%,
            transparent 70%
        );
    pointer-events:none;
}

.icon{
    font-size:60px;
    transform:translateZ(60px);
    animation:float 2.5s infinite ease-in-out;
}

@keyframes float{
    0%,100%{transform:translateZ(60px) translateY(0);}
    50%{transform:translateZ(60px) translateY(-10px);}
}

h1{
    margin-top:12px;
    font-size:28px;
    transform:translateZ(45px);
}

.sub{
    margin:12px 0 25px;
    color:#ddd;
    line-height:1.6;
    transform:translateZ(35px);
}

input{
    width:100%;
    padding:16px;
    border:0;
    outline:none;
    border-radius:16px;

    background:#ffffffee;
    color:#222;

    font-size:17px;
    text-align:center;

    transform:translateZ(40px);
}

input:focus{
    box-shadow:0 0 0 3px #ec489977;
}

.name-preview{
    min-height:60px;
    margin:18px 0;

    font-size:34px;
    font-weight:bold;

    color:#ffd6f1;

    text-shadow:
        0 0 10px #ec4899,
        0 0 30px #ec4899;

    transform:translateZ(70px);

    transition:.3s;
}

button{
    width:100%;
    min-height:50px;

    border:0;
    border-radius:16px;

    color:#fff;
    font-size:17px;
    font-weight:bold;

    cursor:pointer;

    background:
        linear-gradient(90deg,#ec4899,#8b5cf6);

    box-shadow:
        0 10px 30px #ec489955;

    transform:translateZ(45px);

    transition:.25s;
}

button:hover{
    transform:translateZ(55px) scale(1.02);
}

button:active{
    transform:translateZ(35px) scale(.98);
}

/* Surprise */
.surprise{
    display:none;

    margin-top:25px;
    padding:22px 15px;

    border-radius:20px;

    background:#ffffff0d;
    border:1px solid #ffffff18;

    transform:translateZ(50px);

    animation:reveal .8s ease forwards;
}

@keyframes reveal{
    from{
        opacity:0;
        transform:translateZ(50px) scale(.5) rotateX(30deg);
    }
    to{
        opacity:1;
        transform:translateZ(50px) scale(1) rotateX(0);
    }
}

.surprise h2{
    font-size:30px;
    margin-bottom:12px;

    color:#ffb6dc;

    text-shadow:0 0 20px #ec4899;
}

.message{
    font-size:17px;
    line-height:1.7;
    color:#eee;
}

.music{
    position:fixed;
    right:15px;
    top:15px;

    width:45px;
    height:45px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#ffffff18;
    border:1px solid #ffffff33;

    cursor:pointer;
    z-index:20;

    font-size:20px;
}

.music.playing{
    animation:music 1s infinite alternate;
}

@keyframes music{
    from{transform:scale(1);}
    to{transform:scale(1.12);}
}

/* Floating hearts */
.heart{
    position:fixed;
    bottom:-40px;
    pointer-events:none;
    z-index:30;

    animation:rise linear forwards;
}

@keyframes rise{
    from{
        opacity:1;
        transform:translateY(0) rotate(0) scale(.6);
    }
    to{
        opacity:0;
        transform:
            translateY(-110vh)
            rotate(360deg)
            scale(1.5);
    }
}

/* Mobile */
@media(max-width:480px){

    .card{
        padding:28px 20px;
    }

    h1{
        font-size:24px;
    }

    .name-preview{
        font-size:30px;
    }

    .icon{
        font-size:52px;
    }
}
</style>
</head>

<body>

<!-- Music button -->
<div class="music" id="musicBtn" title="Music">
    🔇
</div>

<div class="card" id="card">

    <div class="icon">✨</div>

    <h1>एक खास चीज़ आपके लिए</h1>

    <p class="sub">
        अपना नाम लिखिए...<br>
        फिर देखिए आपके नाम में कितना जादू है 💫
    </p>

    <input
        id="name"
        type="text"
        maxlength="30"
        placeholder="अपना नाम लिखें..."
        autocomplete="off"
    >

    <div class="name-preview" id="preview">
        आपका नाम ✨
    </div>

    <button id="openBtn">
        ✨ मेरा Surprise खोलो
    </button>

    <div class="surprise" id="surprise">

        <h2 id="finalName"></h2>

        <p class="message" id="message"></p>

    </div>

</div>

<script>

/* =========================
   NAME LIVE PREVIEW
========================= */

const nameInput = document.getElementById("name");
const preview = document.getElementById("preview");
const surprise = document.getElementById("surprise");
const finalName = document.getElementById("finalName");
const message = document.getElementById("message");

nameInput.addEventListener("input", () => {

    const name = nameInput.value.trim();

    if(name){

        preview.textContent = "✨ " + name + " ✨";

    }else{

        preview.textContent = "आपका नाम ✨";

    }

    surprise.style.display = "none";
});


/* =========================
   SURPRISE
========================= */

document.getElementById("openBtn").addEventListener("click", () => {

    const name = nameInput.value.trim();

    if(!name){

        nameInput.focus();
        nameInput.placeholder = "पहले अपना नाम लिखिए 😊";
        return;

    }

    finalName.textContent = "💖 " + name + " 💖";

    message.innerHTML =
        "आपका नाम ही आपकी अपनी पहचान है।<br><br>" +
        "✨ आपकी जिंदगी में हमेशा खुशियाँ रहें।<br>" +
        "🌸 चेहरे पर मुस्कान बनी रहे।<br>" +
        "💫 और आपके सपने एक-एक करके पूरे हों।<br><br>" +
        "आज बस इतना याद रखिए — <b>आप खास हैं।</b> ❤️";

    surprise.style.display = "block";

    startMusic();

    createHearts();

});


/* =========================
   3D MOUSE / TOUCH EFFECT
========================= */

const card = document.getElementById("card");

document.addEventListener("mousemove", (e) => {

    if(window.innerWidth < 600) return;

    const x = (window.innerWidth / 2 - e.clientX) / 35;
    const y = (window.innerHeight / 2 - e.clientY) / 35;

    card.style.transform =
        `rotateY(${x}deg) rotateX(${y}deg)`;

});

document.addEventListener("mouseleave", () => {

    card.style.transform =
        "rotateY(0deg) rotateX(0deg)";

});


/* =========================
   FLOATING HEARTS
========================= */

function createHearts(){

    const symbols = [
        "💖","💕","✨","💫","🌸","⭐","💗"
    ];

    for(let i=0;i<35;i++){

        const heart = document.createElement("div");

        heart.className = "heart";

        heart.textContent =
            symbols[Math.floor(Math.random()*symbols.length)];

        heart.style.left =
            Math.random()*100 + "%";

        heart.style.fontSize =
            (16 + Math.random()*25) + "px";

        heart.style.animationDuration =
            (3 + Math.random()*4) + "s";

        document.body.appendChild(heart);

        setTimeout(() => {
            heart.remove();
        },7000);

    }

}


/* =========================
   MUSIC
   No external audio needed.
   Creates a soft ambient melody
   using Web Audio API.
========================= */

let audioContext = null;
let musicPlaying = false;
let musicTimer = null;

function startMusic(){

    if(musicPlaying) return;

    try{

        audioContext =
            new (window.AudioContext ||
            window.webkitAudioContext)();

        musicPlaying = true;

        document.getElementById("musicBtn")
            .textContent = "🔊";

        document.getElementById("musicBtn")
            .classList.add("playing");

        playMelody();

    }catch(error){

        console.log("Music unavailable");

    }
}


function playTone(freq, duration, delay){

    if(!audioContext) return;

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.type = "sine";

    oscillator.frequency.value = freq;

    gain.gain.setValueAtTime(
        0,
        audioContext.currentTime + delay
    );

    gain.gain.linearRampToValueAtTime(
        .055,
        audioContext.currentTime + delay + .05
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioContext.currentTime + delay + duration
    );

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start(
        audioContext.currentTime + delay
    );

    oscillator.stop(
        audioContext.currentTime + delay + duration
    );
}


function playMelody(){

    if(!musicPlaying) return;

    const notes = [
        523.25,
        659.25,
        783.99,
        659.25,
        587.33,
        698.46,
        880,
        698.46
    ];

    notes.forEach((note,index) => {

        playTone(
            note,
            .65,
            index * .38
        );

    });

    musicTimer = setTimeout(
        playMelody,
        3300
    );

}


/* =========================
   MUSIC ON / OFF
========================= */

document.getElementById("musicBtn")
.addEventListener("click", () => {

    if(!musicPlaying){

        startMusic();

    }else{

        musicPlaying = false;

        clearTimeout(musicTimer);

        document.getElementById("musicBtn")
            .textContent = "🔇";

        document.getElementById("musicBtn")
            .classList.remove("playing");

        if(audioContext){

            audioContext.close();

            audioContext = null;

        }

    }

});

</script>

</body>
</html>
