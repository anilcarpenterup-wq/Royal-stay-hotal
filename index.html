<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flower Rise Animation</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    overflow:hidden;
    background:#071116;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* Main Garden */
.garden{
    position:relative;
    width:100%;
    height:100vh;
    max-width:900px;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 65%,
        rgba(0,120,140,.15),
        transparent 35%),
        #030b0f;
}

/* Stars */
.stars{
    position:absolute;
    inset:0;
}

.star{
    position:absolute;
    width:3px;
    height:3px;
    border-radius:50%;
    background:#b8ffff;
    box-shadow:0 0 8px #7fffff;
    animation:twinkle 2s infinite alternate;
}

.star:nth-child(1){left:10%;top:18%;animation-delay:.2s}
.star:nth-child(2){left:20%;top:30%;animation-delay:1s}
.star:nth-child(3){left:31%;top:12%;animation-delay:.5s}
.star:nth-child(4){left:43%;top:22%;animation-delay:1.3s}
.star:nth-child(5){left:54%;top:10%;animation-delay:.7s}
.star:nth-child(6){left:67%;top:25%;animation-delay:1.5s}
.star:nth-child(7){left:78%;top:15%;animation-delay:.4s}
.star:nth-child(8){left:90%;top:32%;animation-delay:1.1s}
.star:nth-child(9){left:73%;top:40%;animation-delay:.9s}
.star:nth-child(10){left:37%;top:38%;animation-delay:.3s}

@keyframes twinkle{
    from{opacity:.15;transform:scale(.6)}
    to{opacity:1;transform:scale(1.5)}
}

/* Grass */
.grass{
    position:absolute;
    bottom:0;
    width:100%;
    height:35%;
}

.blade{
    position:absolute;
    bottom:0;
    width:7px;
    height:130px;
    border-radius:100% 0 100% 0;
    background:linear-gradient(
        to top,
        #063d1d,
        #28c94d
    );
    transform-origin:bottom center;
    animation:sway 3s ease-in-out infinite alternate;
}

@keyframes sway{
    from{transform:rotate(-5deg)}
    to{transform:rotate(8deg)}
}

.b1{left:8%;height:130px}
.b2{left:14%;height:180px;animation-delay:.4s}
.b3{left:22%;height:110px;animation-delay:1s}
.b4{left:80%;height:150px;animation-delay:.6s}
.b5{left:87%;height:120px;animation-delay:1.2s}
.b6{left:94%;height:170px;animation-delay:.2s}

/* Plant */
.plant{
    position:absolute;
    left:50%;
    bottom:5%;
    width:300px;
    height:600px;
    transform:translateX(-50%);
}

/* Stems */
.stem{
    position:absolute;
    bottom:80px;
    width:7px;
    background:linear-gradient(
        to top,
        #075b62,
        #55e0e5
    );
    border-radius:10px;
    transform-origin:bottom;
    animation:grow 2s ease-out forwards,
              stemSway 4s ease-in-out infinite alternate;
}

.stem1{
    left:48%;
    height:430px;
}

.stem2{
    left:28%;
    height:320px;
    transform:rotate(-8deg);
    animation-delay:.3s;
}

.stem3{
    left:69%;
    height:350px;
    transform:rotate(8deg);
    animation-delay:.6s;
}

@keyframes grow{
    from{
        transform:scaleY(0);
    }
    to{
        transform:scaleY(1);
    }
}

@keyframes stemSway{
    from{margin-left:-3px}
    to{margin-left:5px}
}

/* Leaves */
.leaf{
    position:absolute;
    width:65px;
    height:30px;
    background:linear-gradient(
        135deg,
        #087c91,
        #2bc9d1
    );
    border-radius:100% 0 100% 0;
    box-shadow:0 0 12px rgba(50,220,240,.3);
    animation:leafMove 3s ease-in-out infinite alternate;
}

@keyframes leafMove{
    from{transform:rotate(-5deg)}
    to{transform:rotate(7deg)}
}

.l1{left:36%;bottom:310px;transform:rotate(25deg)}
.l2{left:58%;bottom:360px;transform:rotate(-30deg)}
.l3{left:25%;bottom:250px;transform:rotate(-25deg)}
.l4{left:65%;bottom:270px;transform:rotate(25deg)}
.l5{left:42%;bottom:200px;transform:rotate(-20deg)}
.l6{left:52%;bottom:145px;transform:rotate(30deg)}
.l7{left:30%;bottom:150px;transform:rotate(-30deg)}

/* Flower */
.flower{
    position:absolute;
    width:95px;
    height:95px;
    transform:translate(-50%,-50%);
    animation:bloom 1.8s ease-out forwards,
              flowerFloat 4s ease-in-out infinite alternate;
}

@keyframes bloom{
    0%{
        opacity:0;
        transform:translate(-50%,-50%) scale(0);
    }
    70%{
        transform:translate(-50%,-50%) scale(1.15);
    }
    100%{
        opacity:1;
        transform:translate(-50%,-50%) scale(1);
    }
}

@keyframes flowerFloat{
    from{margin-left:-4px}
    to{margin-left:5px}
}

.f1{
    left:50%;
    top:16%;
}

.f2{
    left:28%;
    top:33%;
    animation-delay:.5s;
}

.f3{
    left:72%;
    top:28%;
    animation-delay:1s;
}

/* Petals */
.petal{
    position:absolute;
    left:50%;
    top:50%;
    width:42px;
    height:65px;
    background:linear-gradient(
        to bottom,
        #c9ffff,
        #49bfc8
    );
    border-radius:50% 50% 45% 45%;
    transform-origin:50% 100%;
    filter:drop-shadow(0 0 8px #63e5ed);
}

.p1{transform:translate(-50%,-100%) rotate(0deg)}
.p2{transform:translate(-50%,-100%) rotate(72deg)}
.p3{transform:translate(-50%,-100%) rotate(144deg)}
.p4{transform:translate(-50%,-100%) rotate(216deg)}
.p5{transform:translate(-50%,-100%) rotate(288deg)}

/* Flower Center */
.center{
    position:absolute;
    left:50%;
    top:50%;
    width:28px;
    height:28px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:#efff82;
    box-shadow:
        0 0 8px #ffff55,
        0 0 20px #8effff;
}

/* Bottom leaves / bush */
.bush{
    position:absolute;
    bottom:2%;
    left:50%;
    width:300px;
    height:150px;
    transform:translateX(-50%);
}

.bushLeaf{
    position:absolute;
    width:80px;
    height:35px;
    background:linear-gradient(
        135deg,
        #064f63,
        #20a9bd
    );
    border-radius:100% 0 100% 0;
    filter:drop-shadow(0 0 7px rgba(0,220,240,.3));
}

.bushLeaf:nth-child(1){
    left:5%;
    bottom:35px;
    transform:rotate(-30deg);
}
.bushLeaf:nth-child(2){
    left:18%;
    bottom:65px;
    transform:rotate(25deg);
}
.bushLeaf:nth-child(3){
    left:32%;
    bottom:25px;
    transform:rotate(-20deg);
}
.bushLeaf:nth-child(4){
    left:45%;
    bottom:75px;
    transform:rotate(25deg);
}
.bushLeaf:nth-child(5){
    left:60%;
    bottom:30px;
    transform:rotate(-25deg);
}
.bushLeaf:nth-child(6){
    left:75%;
    bottom:65px;
    transform:rotate(25deg);
}

/* Firefly */
.firefly{
    position:absolute;
    width:5px;
    height:5px;
    background:#cfff63;
    border-radius:50%;
    box-shadow:0 0 12px #dfff55;
    animation:fly 5s linear infinite;
}

.firefly:nth-child(1){left:45%;top:35%}
.firefly:nth-child(2){left:62%;top:22%;animation-delay:1s}
.firefly:nth-child(3){left:35%;top:25%;animation-delay:2s}
.firefly:nth-child(4){left:70%;top:38%;animation-delay:3s}

@keyframes fly{
    0%{transform:translate(0,0);opacity:0}
    20%{opacity:1}
    50%{transform:translate(30px,-40px)}
    80%{opacity:1}
    100%{
        transform:translate(-20px,-80px);
        opacity:0;
    }
}
</style>
</head>

<body>

<div class="garden">

    <!-- Stars -->
    <div class="stars">
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
        <span class="star"></span>
    </div>

    <!-- Fireflies -->
    <span class="firefly"></span>
    <span class="firefly"></span>
    <span class="firefly"></span>
    <span class="firefly"></span>

    <!-- Grass -->
    <div class="grass">
        <span class="blade b1"></span>
        <span class="blade b2"></span>
        <span class="blade b3"></span>
        <span class="blade b4"></span>
        <span class="blade b5"></span>
        <span class="blade b6"></span>
    </div>

    <!-- Main Plant -->
    <div class="plant">

        <div class="stem stem1"></div>
        <div class="stem stem2"></div>
        <div class="stem stem3"></div>

        <!-- Leaves -->
        <span class="leaf l1"></span>
        <span class="leaf l2"></span>
        <span class="leaf l3"></span>
        <span class="leaf l4"></span>
        <span class="leaf l5"></span>
        <span class="leaf l6"></span>
        <span class="leaf l7"></span>

        <!-- Flower 1 -->
        <div class="flower f1">
            <span class="petal p1"></span>
            <span class="petal p2"></span>
            <span class="petal p3"></span>
            <span class="petal p4"></span>
            <span class="petal p5"></span>
            <span class="center"></span>
        </div>

        <!-- Flower 2 -->
        <div class="flower f2">
            <span class="petal p1"></span>
            <span class="petal p2"></span>
            <span class="petal p3"></span>
            <span class="petal p4"></span>
            <span class="petal p5"></span>
            <span class="center"></span>
        </div>

        <!-- Flower 3 -->
        <div class="flower f3">
            <span class="petal p1"></span>
            <span class="petal p2"></span>
            <span class="petal p3"></span>
            <span class="petal p4"></span>
            <span class="petal p5"></span>
            <span class="center"></span>
        </div>

    </div>

    <!-- Bush -->
    <div class="bush">
        <span class="bushLeaf"></span>
        <span class="bushLeaf"></span>
        <span class="bushLeaf"></span>
        <span class="bushLeaf"></span>
        <span class="bushLeaf"></span>
        <span class="bushLeaf"></span>
    </div>

</div>

</body>
</html>
