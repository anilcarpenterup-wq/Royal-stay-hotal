<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>आपके लिए एक खास संदेश ✨</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#16002e,#3b0764,#0f172a);
    color:white;
    overflow:hidden;
    padding:20px;
}

/* Background bubbles */
.bubble{
    position:fixed;
    width:80px;
    height:80px;
    border-radius:50%;
    background:rgba(255,255,255,.08);
    animation:float 8s infinite ease-in-out;
}

.b1{left:5%;top:15%;animation-delay:0s;}
.b2{right:8%;top:25%;width:120px;height:120px;animation-delay:2s;}
.b3{left:20%;bottom:5%;width:100px;height:100px;animation-delay:4s;}
.b4{right:25%;bottom:10%;width:60px;height:60px;animation-delay:1s;}

@keyframes float{
    0%,100%{transform:translateY(0) scale(1);}
    50%{transform:translateY(-30px) scale(1.1);}
}

.card{
    width:100%;
    max-width:480px;
    padding:35px 25px;
    text-align:center;
    border-radius:28px;
    background:rgba(255,255,255,.10);
    border:1px solid rgba(255,255,255,.2);
    backdrop-filter:blur(18px);
    box-shadow:0 20px 60px rgba(0,0,0,.4);
    position:relative;
    z-index:2;
}

.emoji{
    font-size:55px;
    margin-bottom:10px;
    animation:pulse 2s infinite;
}

@keyframes pulse{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.12);}
}

h1{
    font-size:28px;
    margin-bottom:10px;
}

.subtitle{
    color:#ddd;
    margin-bottom:25px;
    line-height:1.6;
}

input{
    width:100%;
    padding:16px 18px;
    border:none;
    outline:none;
    border-radius:15px;
    font-size:17px;
    text-align:center;
    background:rgba(255,255,255,.95);
    color:#222;
    margin-bottom:15px;
}

button{
    width:100%;
    padding:15px;
    border:0;
    border-radius:15px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    color:white;
    background:linear-gradient(90deg,#ec4899,#8b5cf6);
    transition:.3s;
    box-shadow:0 8px 25px rgba(236,72,153,.3);
}

button:hover{
    transform:translateY(-3px);
    box-shadow:0 12px 30px rgba(236,72,153,.5);
}

#preview{
    min-height:65px;
    margin:15px 0;
    font-size:25px;
    font-weight:bold;
    color:#f9a8d4;
    transition:.3s;
}

#message{
    display:none;
    margin-top:25px;
    padding:22px 15px;
    border-radius:20px;
    background:rgba(255,255,255,.1);
    animation:showMessage .8s ease;
}

@keyframes showMessage{
    from{
        opacity:0;
        transform:scale(.7) translateY(20px);
    }
    to{
        opacity:1;
        transform:scale(1) translateY(0);
    }
}

#messageName{
    font-size:32px;
    color:#f9a8d4;
    margin-bottom:15px;
}

.messageText{
    font-size:18px;
    line-height:1.7;
    color:#eee;
}

.heart{
    position:fixed;
    pointer-events:none;
    animation:heartUp 2.5s linear forwards;
    z-index:10;
}

@keyframes heartUp{
    0%{
        transform:translateY(0) scale(.5);
        opacity:1;
    }
    100%{
        transform:translateY(-500px) rotate(25deg) scale(1.5);
        opacity:0;
    }
}

.footer{
    margin-top:22px;
    font-size:12px;
    color:#aaa;
}
</style>
</head>

<body>

<div class="bubble b1"></div>
<div class="bubble b2"></div>
<div class="bubble b3"></div>
<div class="bubble b4"></div>

<div class="card">

    <div class="emoji">✨</div>

    <h1>एक खास संदेश आपके लिए</h1>

    <p class="subtitle">
        अपना नाम लिखिए...<br>
        शायद आपके नाम में ही कोई खास बात छुपी हो 💫
    </p>

    <input
        type="text"
        id="nameInput"
        placeholder="यहाँ अपना नाम लिखें..."
        autocomplete="off"
    >

    <div id="preview"></div>

    <button onclick="showMessage()">
        मेरे लिए संदेश खोलें ✨
    </button>

    <div id="message">

        <div id="messageName"></div>

        <div class="messageText" id="messageText"></div>

    </div>

    <div class="footer">
        एक छोटी सी मुस्कान के नाम 😊
    </div>

</div>

<script>

const input = document.getElementById("nameInput");
const preview = document.getElementById("preview");

input.addEventListener("input", function(){

    let name = input.value.trim();

    if(name === ""){
        preview.innerHTML = "";
        return;
    }

    preview.innerHTML = "✨ " + name + " ✨";

});

function showMessage(){

    let name = input.value.trim();

    if(name === ""){
        input.focus();
        input.placeholder = "पहले अपना नाम लिखिए 😊";
        return;
    }

    document.getElementById("messageName").innerHTML =
        "💖 " + name + " 💖";

    document.getElementById("messageText").innerHTML =
        "आपका नाम जितना खूबसूरत है,<br>" +
        "उम्मीद है आपकी जिंदगी उससे भी ज्यादा खूबसूरत हो।<br><br>" +
        "✨ मुस्कुराते रहिए, क्योंकि आपकी मुस्कान खास है। ✨";

    document.getElementById("message").style.display = "block";

    createHearts();

    document.getElementById("message").scrollIntoView({
        behavior:"smooth",
        block:"center"
    });
}

function createHearts(){

    const symbols = ["💖","✨","💫","💕","🌸","⭐"];

    for(let i=0;i<25;i++){

        const heart = document.createElement("div");

        heart.className = "heart";

        heart.innerHTML =
            symbols[Math.floor(Math.random()*symbols.length)];

        heart.style.left =
            Math.random()*100 + "vw";

        heart.style.bottom = "0";

        heart.style.fontSize =
            (18 + Math.random()*25) + "px";

        heart.style.animationDuration =
            (1.5 + Math.random()*2) + "s";

        document.body.appendChild(heart);

        setTimeout(()=>{
            heart.remove();
        },4000);
    }
}

</script>

</body>
</html>
