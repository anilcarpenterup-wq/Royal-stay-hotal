<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blue Flower & Blooming Rose</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:#03090d;
}

.garden{
    width:100vw;
    height:100vh;
    position:relative;
    overflow:hidden;

    background:
      radial-gradient(circle at 50% 55%,
      rgba(0,110,125,.18),
      transparent 38%),
      #03090d;
}

/* ================= STARS ================= */

.star{
    position:absolute;
    width:3px;
    height:3px;
    border-radius:50%;
    background:#c9ffff;
    box-shadow:0 0 9px #8fffff;
    animation:twinkle 2s infinite alternate;
}

@keyframes twinkle{
    from{opacity:.15;transform:scale:.5}
    to{opacity:1;transform:scale(1.5)}
}

.s1{left:8%;top:15%}
.s2{left:18%;top:28%;animation-delay:.4s}
.s3{left:30%;top:10%;animation-delay:.9s}
.s4{left:43%;top:20%;animation-delay:1.3s}
.s5{left:55%;top:8%;animation-delay:.6s}
.s6{left:67%;top:27%;animation-delay:1.7s}
.s7{left:80%;top:14%;animation-delay:.3s}
.s8{left:91%;top:31%;animation-delay:1s}
.s9{left:74%;top:40%;animation-delay:.8s}
.s10{left:37%;top:37%;animation-delay:1.5s}


/* ================= FIREFLIES ================= */

.firefly{
    position:absolute;
    width:5px;
    height:5px;
    border-radius:50%;
    background:#dfff55;
    box-shadow:0 0 15px #dfff55;
    animation:fly 6s linear infinite;
}

@keyframes fly{
    0%{
        transform:translate(0,0);
        opacity:0;
    }
    20%{opacity:1}
    50%{
        transform:translate(35px,-45px);
    }
    80%{opacity:1}
    100%{
        transform:translate(-20px,-90px);
        opacity:0;
    }
}

.fi1{left:40%;top:35%}
.fi2{left:60%;top:23%;animation-delay:1.5s}
.fi3{left:75%;top:35%;animation-delay:3s}
.fi4{left:32%;top:25%;animation-delay:4s}


/* ================= GRASS ================= */

.grass{
    position:absolute;
    bottom:0;
    width:100%;
    height:30%;
}

.blade{
    position:absolute;
    bottom:0;
    width:6px;
    border-radius:100% 0 100% 0;

    background:linear-gradient(
        to top,
        #043817,
        #32c94d
    );

    transform-origin:bottom;
    animation:grassMove 3s ease-in-out infinite alternate;
}

@keyframes grassMove{
    from{transform:rotate(-6deg)}
    to{transform:rotate(7deg)}
}

.g1{left:5%;height:140px}
.g2{left:12%;height:190px;animation-delay:.4s}
.g3{left:20%;height:120px;animation-delay:1s}
.g4{left:82%;height:160px;animation-delay:.7s}
.g5{left:90%;height:120px;animation-delay:1.3s}
.g6{left:96%;height:180px;animation-delay:.2s}


/* ================= PLANT ================= */

.plant{
    position:absolute;
    left:50%;
    bottom:5%;
    width:600px;
    height:650px;
    transform:translateX(-50%);
}


/* ================= STEMS ================= */

.stem{
    position:absolute;
    bottom:55px;
    width:7px;
    border-radius:10px;

    background:linear-gradient(
        to top,
        #07525a,
        #4bdde2
    );

    transform-origin:bottom;

    animation:
      growStem 2s ease-out forwards,
      stemWind 4s ease-in-out infinite alternate;
}

.blueStem{
    left:30%;
    height:390px;
    transform:rotate(-7deg);
}

.roseStem{
    left:69%;
    height:410px;
    transform:rotate(7deg);
}

@keyframes growStem{
    from{transform:scaleY(0)}
    to{transform:scaleY(1)}
}

@keyframes stemWind{
    from{margin-left:-3px}
    to{margin-left:5px}
}


/* ================= LEAVES ================= */

.leaf{
    position:absolute;
    width:75px;
    height:32px;

    background:linear-gradient(
        135deg,
        #064b5b,
        #20aebe
    );

    border-radius:100% 0 100% 0;
    box-shadow:0 0 10px rgba(40,220,230,.25);

    animation:leafWind 3s ease-in-out infinite alternate;
}

@keyframes leafWind{
    from{margin-left:-3px}
    to{margin-left:5px}
}

.l1{
    left:22%;
    bottom:260px;
    transform:rotate(-28deg);
}

.l2{
    left:36%;
    bottom:350px;
    transform:rotate(28deg);
}

.l3{
    left:55%;
    bottom:260px;
    transform:rotate(-30deg);
}

.l4{
    left:66%;
    bottom:350px;
    transform:rotate(28deg);
}

.l5{
    left:45%;
    bottom:170px;
    transform:rotate(-25deg);
}

.l6{
    left:62%;
    bottom:160px;
    transform:rotate(25deg);
}


/* ==================================================
                    BLUE FLOWER
================================================== */

.blueFlower{
    position:absolute;
    left:30%;
    top:28%;
    width:100px;
    height:100px;

    transform:translate(-50%,-50%);

    animation:blueSway 4s ease-in-out infinite alternate;
}

@keyframes blueSway{
    from{margin-left:-4px}
    to{margin-left:5px}
}

.bluePetal{
    position:absolute;
    left:50%;
    top:50%;

    width:43px;
    height:65px;

    border-radius:50%;

    background:linear-gradient(
        to bottom,
        #d5ffff,
        #48bdc8
    );

    transform-origin:50% 100%;
    filter:drop-shadow(0 0 9px #55e5ee);
}

.bp1{transform:translate(-50%,-100%) rotate(0)}
.bp2{transform:translate(-50%,-100%) rotate(72deg)}
.bp3{transform:translate(-50%,-100%) rotate(144deg)}
.bp4{transform:translate(-50%,-100%) rotate(216deg)}
.bp5{transform:translate(-50%,-100%) rotate(288deg)}

.blueCenter{
    position:absolute;
    left:50%;
    top:50%;

    width:27px;
    height:27px;

    transform:translate(-50%,-50%);
    border-radius:50%;

    background:#f2ff70;

    box-shadow:
      0 0 8px #ffff55,
      0 0 20px #8effff;
}


/* ==================================================
                       REAL ROSE
================================================== */

.rose{
    position:absolute;

    left:69%;
    top:25%;

    width:150px;
    height:150px;

    transform:
      translate(-50%,-50%)
      scale(.18);

    animation:roseBloom 10s ease-in-out infinite;

    filter:
      drop-shadow(0 0 12px rgba(255,30,60,.45));
}


/* ---------- Outer petals ---------- */

.petal{
    position:absolute;

    left:50%;
    top:50%;

    width:65px;
    height:90px;

    border-radius:
      55% 55% 45% 45%;

    transform-origin:
      50% 92%;

    background:
      radial-gradient(
        ellipse at 50% 75%,
        #ff8292 0%,
        #e52a4f 48%,
        #88001e 100%
      );

    box-shadow:
      inset -7px -10px 15px rgba(70,0,20,.35),
      inset 4px 3px 8px rgba(255,160,170,.25);
}


/* Outer layer */

.p1{
    transform:
      translate(-50%,-50%)
      rotate(0deg)
      translateY(-22px);
}

.p2{
    transform:
      translate(-50%,-50%)
      rotate(45deg)
      translateY(-22px);
}

.p3{
    transform:
      translate(-50%,-50%)
      rotate(90deg)
      translateY(-22px);
}

.p4{
    transform:
      translate(-50%,-50%)
      rotate(135deg)
      translateY(-22px);
}

.p5{
    transform:
      translate(-50%,-50%)
      rotate(180deg)
      translateY(-22px);
}

.p6{
    transform:
      translate(-50%,-50%)
      rotate(225deg)
      translateY(-22px);
}

.p7{
    transform:
      translate(-50%,-50%)
      rotate(270deg)
      translateY(-22px);
}

.p8{
    transform:
      translate(-50%,-50%)
      rotate(315deg)
      translateY(-22px);
}


/* ---------- Inner petals ---------- */

.inner{
    position:absolute;

    left:50%;
    top:50%;

    width:48px;
    height:68px;

    border-radius:
      55% 55% 45% 45%;

    transform-origin:
      50% 90%;

    background:
      linear-gradient(
        135deg,
        #ff8fa0,
        #d71942 70%,
        #85001e
      );

    box-shadow:
      inset -4px -7px 10px rgba(70,0,20,.35);
}

.i1{
    transform:
      translate(-50%,-50%)
      rotate(25deg)
      translateY(-12px);
}

.i2{
    transform:
      translate(-50%,-50%)
      rotate(115deg)
      translateY(-12px);
}

.i3{
    transform:
      translate(-50%,-50%)
      rotate(205deg)
      translateY(-12px);
}

.i4{
    transform:
      translate(-50%,-50%)
      rotate(295deg)
      translateY(-12px);
}


/* ---------- Rose center ---------- */

.roseCenter{
    position:absolute;

    left:50%;
    top:50%;

    width:36px;
    height:48px;

    border-radius:
      55% 45% 50% 50%;

    background:
      linear-gradient(
        135deg,
        #ff7187,
        #b50031
      );

    transform:
      translate(-50%,-50%)
      rotate(-18deg);

    box-shadow:
      inset -6px -6px 10px rgba(70,0,20,.4),
      0 0 12px rgba(255,60,90,.4);
}


/* ==================================================
              ROSE OPENS SLOWLY
================================================== */

@keyframes roseBloom{

    /* बंद कली */
    0%{
        transform:
          translate(-50%,-50%)
          scale(.18)
          rotate(-4deg);
    }

    /* कली थोड़ी खुलती है */
    15%{
        transform:
          translate(-50%,-50%)
          scale(.30)
          rotate(3deg);
    }

    /* पंखुड़ियाँ बाहर आने लगती हैं */
    32%{
        transform:
          translate(-50%,-50%)
          scale(.48)
          rotate(-3deg);
    }

    /* गुलाब आधा खुला */
    50%{
        transform:
          translate(-50%,-50%)
          scale(.72)
          rotate(3deg);
    }

    /* लगभग पूरा खिला */
    68%{
        transform:
          translate(-50%,-50%)
          scale(.94)
          rotate(-2deg);
    }

    /* पूरा खिला गुलाब */
    78%{
        transform:
          translate(-50%,-50%)
          scale(1.08)
          rotate(2deg);
    }

    88%{
        transform:
          translate(-50%,-50%)
          scale(1)
          rotate(-1deg);
    }

    /* फिर वापस कली */
    100%{
        transform:
          translate(-50%,-50%)
          scale(.18)
          rotate(-4deg);
    }
}

</style>
</head>


<body>

<div class="garden">

    <!-- Stars -->
    <span class="star s1"></span>
    <span class="star s2"></span>
    <span class="star s3"></span>
    <span class="star s4"></span>
    <span class="star s5"></span>
    <span class="star s6"></span>
    <span class="star s7"></span>
    <span class="star s8"></span>
    <span class="star s9"></span>
    <span class="star s10"></span>

    <!-- Fireflies -->
    <span class="firefly fi1"></span>
    <span class="firefly fi2"></span>
    <span class="firefly fi3"></span>
    <span class="firefly fi4"></span>


    <!-- Grass -->
    <div class="grass">
        <span class="blade g1"></span>
        <span class="blade g2"></span>
        <span class="blade g3"></span>
        <span class="blade g4"></span>
        <span class="blade g5"></span>
        <span class="blade g6"></span>
    </div>


    <!-- Plant -->
    <div class="plant">

        <!-- Stems -->
        <div class="stem blueStem"></div>
        <div class="stem roseStem"></div>


        <!-- Leaves -->
        <span class="leaf l1"></span>
        <span class="leaf l2"></span>
        <span class="leaf l3"></span>
        <span class="leaf l4"></span>
        <span class="leaf l5"></span>
        <span class="leaf l6"></span>


        <!-- ================= BLUE FLOWER ================= -->

        <div class="blueFlower">

            <span class="bluePetal bp1"></span>
            <span class="bluePetal bp2"></span>
            <span class="bluePetal bp3"></span>
            <span class="bluePetal bp4"></span>
            <span class="bluePetal bp5"></span>

            <span class="blueCenter"></span>

        </div>


        <!-- ================= REAL ROSE ================= -->

        <div class="rose">

            <!-- Outer petals -->
            <span class="petal p1"></span>
            <span class="petal p2"></span>
            <span class="petal p3"></span>
            <span class="petal p4"></span>
            <span class="petal p5"></span>
            <span class="petal p6"></span>
            <span class="petal p7"></span>
            <span class="petal p8"></span>

            <!-- Inner petals -->
            <span class="inner i1"></span>
            <span class="inner i2"></span>
            <span class="inner i3"></span>
            <span class="inner i4"></span>

            <!-- Center -->
            <span class="roseCenter"></span>

        </div>

    </div>

</div>

</body>
</html>
